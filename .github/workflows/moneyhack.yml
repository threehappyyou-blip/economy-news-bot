name: Warm Insight Money Hack Poster

on:
  schedule:
    # v47 - 주 5회(월~금) → 주 1회(월)로 축소.
    # Money Hack(부업/제휴마케팅)은 ETF·투자 초보자라는 핵심 주제와 결이 달라서
    # 발행량이 많을수록 사이트 전체의 주제 집중도를 흐림. 완전히 멈추고 싶다면
    # 아래 3줄을 주석 처리하고 workflow_dispatch(수동 실행)만 남겨두면 됨:
    # - cron: '15 13 * * 2'
    # - cron: '35 13 * * 2'
    # - cron: '55 13 * * 2'
    # v48 - 월요일에 Foundation·Insight·Philosophy까지 겹쳐서 하루 4개씩 몰리는
    # 문제로 화요일로 이동 (요일만 재배치, 주 1회 발행량은 그대로 유지).
    - cron: '15 13 * * 2'  # 1차 시도 (매주 화요일)
    - cron: '35 13 * * 2'  # 2차 재시도 (20분 후)
    - cron: '55 13 * * 2'  # 3차 재시도 (40분 후)

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cloudscraper

      - name: Run Money Hack Bot
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        # 'moneyhack' 명령어를 통해 해당 파이프라인만 실행합니다.
        run: python main.py moneyhack

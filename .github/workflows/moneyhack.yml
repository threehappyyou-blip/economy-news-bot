name: Warm Insight Money Hack Poster

on:
  schedule:
    # 🌅 [미국 뉴욕 시간 오전 9시 15분] - UTC 13:15 - 매주 월~금요일(1-5) 발행
    # (다른 카테고리와 겹쳐 서버가 다운되지 않도록 15분에 실행됩니다)
    - cron: '15 13 * * 1-5'  # 1차 시도
    - cron: '35 13 * * 1-5'  # 2차 재시도 (20분 후)
    - cron: '55 13 * * 1-5'  # 3차 재시도 (40분 후)

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cloudscraper

      - name: Run Money Hack Bot
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        # 'moneyhack' 명령어를 통해 해당 파이프라인만 실행합니다.
        run: python main.py moneyhack

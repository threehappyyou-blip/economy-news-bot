name: Generate Mascot Assets (one-off)

# Manual-only — this is NOT part of the daily pipeline. Run it once (or
# whenever you want to regenerate the mascot's look) from the Actions tab.
# It renders the hand-drawn mascot design to a reference image, sends it to
# fal.ai's Ideogram Character model to produce 3 consistent AI poses, and
# commits them into warminsight-daily-short/assets/ so the daily workflow
# picks them up automatically from then on (zero extra daily cost).
on:
  workflow_dispatch: {}

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: warminsight-daily-short
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Render mascot reference image (from the existing hand-drawn design)
        run: node render_mascot_reference.js

      - name: Generate 3 consistent AI poses via fal.ai
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node fal_character.js

      - name: Commit generated assets back to the repo
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add warminsight-daily-short/assets/
          if git diff --cached --quiet; then
            echo "No new/changed assets to commit."
          else
            git commit -m "Generate mascot pose assets via fal.ai Ideogram Character"
            git push
          fi

      - name: Upload assets as workflow artifact too (in case commit/push failed)
        uses: actions/upload-artifact@v4
        with:
          name: mascot-assets
          path: warminsight-daily-short/assets/
          retention-days: 30

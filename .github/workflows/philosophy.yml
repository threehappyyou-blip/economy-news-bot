name: Warm Insight Philosophy Poster

on:
  schedule:
    # v47 - 아침반+저녁반(매일 2회, 주 14회) → 주 1회로 대폭 축소.
    # 이 카테고리가 가장 심했던 중복 발행 원인이었음: PHILOSOPHY_TOPICS가
    # 3개뿐인데 하루 2번씩 발행되니 같은 주제가 며칠 간격으로 계속 반복됨.
    # 서치 콘솔 인기 검색어에도 이 카테고리 관련 유입이 전혀 없었으므로
    # 우선 최소 빈도로 낮춰두고, 나중에 성과를 보고 재조정하는 걸 권장.
    # 저녁반(20:00 EDT) 스케줄은 통째로 제거했습니다.
    - cron: '0 11 * * 1'    # 1차 시도 (매주 월요일 07:00 EDT)
    - cron: '20 11 * * 1'   # 2차 재시도 (20분 후)
    - cron: '40 11 * * 1'   # 3차 재시도 (40분 후)

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Philosophy Bot
        env:
          PYTHONUNBUFFERED: "1"  # 실시간 로그 출력
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py philosophy

name: Warm Insight Philosophy Poster

on:
  schedule:
    # v45.3 — 3-attempt retry within same UTC day per slot

    # 🌅 아침판 (07:00 EDT / UTC 11:00 / KST 20:00 전날)
    - cron: '0 11 * * *'    # 1차 시도
    - cron: '20 11 * * *'   # 2차 재시도 (20분 후)
    - cron: '40 11 * * *'   # 3차 재시도 (40분 후)

    # 🌙 저녁판 (20:00 EDT / UTC 00:00 / KST 09:00)
    - cron: '0 0 * * *'     # 1차 시도
    - cron: '20 0 * * *'    # 2차 재시도 (20분 후)
    - cron: '40 0 * * *'    # 3차 재시도 (40분 후)

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Philosophy Bot
        env:
          PYTHONUNBUFFERED: "1"      # 실시간 로그 출력
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        # 🚨 아래 명령어에 'philosophy'가 붙어있어야만 철학 글이 발행됩니다!
        run: python main.py philosophy

name: Warm Insight Foundation Poster

on:
  schedule:
    # v47 - 매일 → 주 3회(월/수/금)로 축소.
    # 이유: FOUNDATION_TOPICS가 3개뿐이던 시절 매일 발행하면 3일에 한 번꼴로
    # 같은 주제가 반복됐음. main.py에서 12개로 늘리고 순환 방식으로 바꿨지만,
    # 그래도 발행 속도 자체를 늦춰서 한 편당 더 다듬어질 시간을 주는 게 목적.
    # 12:00 EDT (UTC 16:00) - 점심시간 학습 콘텐츠
    - cron: '0 16 * * 1,3,5'    # 1차 시도 (월/수/금)
    - cron: '20 16 * * 1,3,5'   # 2차 재시도 (20분 후)
    - cron: '40 16 * * 1,3,5'   # 3차 재시도 (40분 후)
  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Foundation Bot
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py foundation

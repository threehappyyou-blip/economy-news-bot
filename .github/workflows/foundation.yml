name: Warm Insight Foundation Poster

on:
  schedule:
    # v45.3 - 3-attempt retry within same UTC day (썸네일 실패 시 자동 재시도)
    # 12:00 EDT (UTC 16:00) - 점심시간 학습 콘텐츠
    # KST 01:00 / 01:20 / 01:40 기준
    - cron: '0 16 * * *'    # 1차 시도
    - cron: '20 16 * * *'   # 2차 재시도 (20분 후)
    - cron: '40 16 * * *'   # 3차 재시도 (40분 후)
  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Foundation Bot
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py foundation

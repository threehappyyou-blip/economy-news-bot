name: Warm Insight On-Chain Poster

on:
  schedule:
    # v47 - 주 2회(화,목) → 주 1회(목)로 축소.
    # ETF·인덱스 투자 초보자로 주제를 좁히는 방향과는 다소 결이 달라서
    # 우선 빈도만 줄임. 완전히 뺄지는 판단해서 나중에 조정해도 됨.
    - cron: '10 13 * * 4'  # 1차 시도 (매주 목요일)
    - cron: '30 13 * * 4'  # 2차 재시도 (실패 시 20분 후)
    - cron: '50 13 * * 4'  # 3차 재시도 (실패 시 40분 후)

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cloudscraper  # WAF 우회를 위한 필수 패키지 설치

      - name: Run On-Chain Bot
        env:
          PYTHONUNBUFFERED: "1"  # 실시간 로그 출력
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        # 끝에 'onchain'을 붙여 On-Chain 카테고리만 발행되도록 파이썬 스크립트에 전달합니다.
        run: python main.py onchain

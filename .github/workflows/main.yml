name: Warm Insight Auto Poster

on:
  schedule:
    # 🌅 [미국 뉴욕 시간 오전 9시] - UTC 13:00 (실패 시 20분 간격 재시도)
    - cron: '0 13 * * *'
    - cron: '20 13 * * *'
    - cron: '40 13 * * *'

    # 🌇 [미국 뉴욕 시간 오후 6시] - UTC 22:00 (실패 시 20분 간격 재시도)
    - cron: '0 22 * * *'
    - cron: '20 22 * * *'
    - cron: '40 22 * * *'

  workflow_dispatch:
    inputs:
      force_publish:
        description: '중복 체크 무시하고 강제 발행 (테스트용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Poster Bot
        env:
          PYTHONUNBUFFERED: "1"                 # 실시간 로그 출력
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        run: python main.py

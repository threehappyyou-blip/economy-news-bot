name: Warm Insight Daily Short

on:
  schedule:
    # 22:00 UTC = 07:00 KST every day
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # lets you click "Run workflow" in the GitHub UI to test manually

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warminsight-daily-short
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build today's scene (pick today's hook)
        run: node build.js

      - name: Generate AI background clip via fal.ai (optional)
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node fal_video.js
        continue-on-error: true  # never let a fal.ai hiccup block the daily send

      - name: Extend AI background to the full 15s (boomerang loop), or fall back
        run: |
          if [ -f ai_bg_raw.mp4 ]; then
            echo "Extending today's AI clip to 15s with a seamless boomerang loop (forward + reverse + forward)."
            # The raw clip is ~5s; playing it forward, then reverse, then
            # forward again gives exactly 3x its length with NO visible seam
            # (the reverse segment ends exactly where the forward one
            # started), so the same single generated clip now covers the
            # whole video at zero extra AI cost. -frames:v 450 (=15s@30fps)
            # is a hard frame-exact cap, more reliable than -t for a
            # non-30fps AI source.
            ffmpeg -y -i ai_bg_raw.mp4 -filter_complex \
              "[0:v]fps=30,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1[v0];[v0]split=2[a][b];[b]reverse[r];[a]split=2[a1][a2];[a1][r][a2]concat=n=3:v=1:a=0[outv]" \
              -map "[outv]" -frames:v 450 -vsync cfr \
              -c:v libx264 -profile:v high -crf 17 -preset slow -pix_fmt yuv420p -an \
              ai_bg.mp4
          else
            echo "No AI clip available today — using a plain animated gradient for the full 15s instead."
            ffmpeg -y -f lavfi -i "gradients=size=1080x1920:rate=30:duration=15:speed=0.05" \
              -frames:v 450 -c:v libx264 -pix_fmt yuv420p ai_bg.mp4
          fi

      - name: Record transparent text/mascot overlay for all 5 scenes (PNG sequence)
        run: node record_overlay.js

      - name: Composite final video (AI background + text/mascot overlay, full 15s)
        run: |
          rm -f warminsight_short_*.mp4
          # Background now already covers the full 15s (see previous step),
          # so this single pass composites and ships the whole video — no
          # more scene1-only composite + concat with a separately-rendered
          # scenes2to5.mp4. -frames:v 450 (=15s@30fps exactly) stays as the
          # hard frame-exact safety cap on the final output.
          ffmpeg -y -t 15 -i ai_bg.mp4 -t 15 -framerate 30 -i overlay_frames/frame_%04d.png \
            -filter_complex "[0:v]fps=30[bg];[bg][1:v]overlay=0:0:format=auto,fps=30[outv]" \
            -map "[outv]" -frames:v 450 -vsync cfr \
            -c:v libx264 -profile:v high -crf 17 -preset slow -movflags +faststart -pix_fmt yuv420p -an \
            warminsight_short_$(date -u +%F).mp4

      - name: Verify video specs
        run: |
          ffprobe -v error -show_entries format=duration \
            -show_entries stream=width,height,codec_name,codec_type \
            -of default=noprint_wrappers=1 warminsight_short_*.mp4

      - name: Generate captions and tags
        run: node gen_caption.js

      - name: Send email with video attached
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node send_email.js

      - name: Upload video as workflow artifact (backup/history)
        uses: actions/upload-artifact@v4
        with:
          name: warminsight-short-${{ github.run_id }}
          path: |
            warminsight-daily-short/warminsight_short_*.mp4
            warminsight-daily-short/caption_and_tags.md
          retention-days: 30
